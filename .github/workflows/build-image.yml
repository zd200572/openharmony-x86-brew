name: build-image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache OHOS SDK
        uses: actions/cache@v4
        with:
          path: /root/ohos-x86/ohos-sdk
          key: ohos-sdk-7.0-native-v1

      - name: Build rootfs & image
        run: sudo -E bash ci/build-image.sh
        env:
          REPO_DIR: ${{ github.workspace }}

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/dockerharmony
        run: |
          IMAGE="${IMAGE,,}"   # ghcr 要求小写
          docker tag dockerharmony:x86_64 "$IMAGE:x86_64"
          docker tag dockerharmony:x86_64 "$IMAGE:latest"
          docker push "$IMAGE:x86_64"
          docker push "$IMAGE:latest"
          echo "镜像: $IMAGE:x86_64" >> "$GITHUB_STEP_SUMMARY"
